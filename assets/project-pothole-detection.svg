<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p2-t">
  <title id="p2-t">AI-based Road Pothole Detection: First Prize in ISTE</title>
  <defs>
    <linearGradient id="p2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="p2-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#0284C7" stop-opacity=".65"/><stop offset="1" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38BDF8" stroke-opacity=".08"/>
    </pattern>
    <filter id="p2-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p2-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p2-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#93C5FD"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p2-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p2-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p2-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p2-in { animation: p2-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p2-d1 { animation-delay: .15s; } .p2-d2 { animation-delay: .4s; }
    .p2-chip { animation: p2-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p2-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p2-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p2-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p2-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p2-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-in, .p2-chip { animation: none; } .p2-draw { animation: none; stroke-dashoffset: 0; } }
    .p2-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p2-trace 7s linear infinite; }
    @keyframes p2-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p2-trace { display: none; } }
  </style>
  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="370" fill="url(#p2-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p2-grid)"/>
    <rect width="1200" height="370" fill="url(#p2-glow)"/>
    <g class="p2-in p2-d1">
      <text class="p2-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#38BDF8">02 · COMPUTER VISION · APPLIED AI · ISTE FIRST PRIZE AWARD</text>
      <text class="p2-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8FAFC">AI Road Pothole Detection</text>
      <text class="p2-sans" x="56" y="166" font-size="17" fill="#94A3B8">Automated road hazard detection using computer vision and deep learning models.</text>
      <text class="p2-mono" x="56" y="200" font-size="12.5" fill="#BAE6FD"><tspan fill="#38BDF8">AWARDED ›</tspan> First Prize in ISTE (Indian Society for Technical Education) state/regional competition</text>
      <line class="p2-draw" x1="56" y1="226" x2="680" y2="226" stroke="#38BDF8" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p2-serif" font-size="32" font-weight="300" fill="#F8FAFC">1st Prize</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">ISTE state convention recognition</text></g>
      <g transform="translate(266 266)"><text class="p2-serif" font-size="32" font-weight="300" fill="#F8FAFC">Real-time</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">automated surface hazard vision</text></g>
      <g transform="translate(486 266)"><text class="p2-serif" font-size="32" font-weight="300" fill="#F8FAFC">Python · CV</text><text class="p2-sans" y="24" font-size="12.5" fill="#94A3B8">image preprocessing &amp; detection</text></g>
      <g class="p2-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p2-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Python</text></g>
      <g class="p2-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="124" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p2-mono" x="196" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Computer Vision</text></g>
      <g class="p2-chip" style="animation-delay:1.24s"><rect x="266" y="314" width="112" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p2-mono" x="322" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Deep Learning</text></g>
      <g class="p2-chip" style="animation-delay:1.36s"><rect x="386" y="314" width="134" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p2-mono" x="453" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Hazard Detection</text></g>
      <g class="p2-chip" style="animation-delay:1.48s"><rect x="528" y="314" width="140" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p2-mono" x="598" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">ISTE State Award</text></g>
    </g>
    <g class="p2-in p2-d2"><g transform="translate(0 35)">
      <g transform="translate(860 40)">
        <!-- Video frame / camera viewport -->
        <rect x="0" y="8" width="260" height="180" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".4"/>
        <line x1="20" y1="20" x2="40" y2="20" stroke="#38BDF8" stroke-width="2"/>
        <line x1="20" y1="20" x2="20" y2="40" stroke="#38BDF8" stroke-width="2"/>
        <line x1="240" y1="20" x2="220" y2="20" stroke="#38BDF8" stroke-width="2"/>
        <line x1="240" y1="20" x2="240" y2="40" stroke="#38BDF8" stroke-width="2"/>
        <line x1="20" y1="176" x2="40" y2="176" stroke="#38BDF8" stroke-width="2"/>
        <line x1="20" y1="176" x2="20" y2="156" stroke="#38BDF8" stroke-width="2"/>
        <line x1="240" y1="176" x2="220" y2="176" stroke="#38BDF8" stroke-width="2"/>
        <line x1="240" y1="176" x2="240" y2="156" stroke="#38BDF8" stroke-width="2"/>
        <!-- Simulated road perspective -->
        <path d="M40 160 L100 80 L160 80 L220 160 Z" fill="#1E293B" fill-opacity=".4"/>
        <!-- Detected pothole bounding box -->
        <g transform="translate(105 110)">
          <rect width="64" height="38" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.8">
            <animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
          </rect>
          <rect y="-14" width="58" height="14" fill="#F59E0B"/>
          <text class="p2-mono" x="4" y="-3" font-size="9" font-weight="bold" fill="#0F172A">POTHOLE 96%</text>
        </g>
        <!-- Overlay HUD tag -->
        <g transform="translate(20 196)">
          <rect width="220" height="38" rx="8" fill="#0B1120" fill-opacity=".95" stroke="#38BDF8" stroke-opacity=".45"/>
          <text class="p2-mono" x="14" y="24" font-size="11" fill="#34D399">ISTE 1ST PRIZE WINNER</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#38BDF8" stroke-opacity=".2"/>
    <rect class="p2-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p2-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
