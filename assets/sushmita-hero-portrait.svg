<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mano Teja Reddy — AI &amp; Data Science | Aspiring AI Engineer | Web Developer</title>
  <desc id="hero-desc">Building intelligent applications, AI-powered products, and modern web experiences. SIETK · JNTUA · B.Tech 2027 · CGPA 8.35.</desc>

  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset=".55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </radialGradient>
    <radialGradient id="hero-light-a" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-b" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-name-grad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="650" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".4" stop-color="#BAE6FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="hero-sheen" gradientUnits="userSpaceOnUse" x1="-360" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1100 0;1100 0" keyTimes="0;.35;1" dur="8s" begin="2.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset=".2" stop-color="#60A5FA"/>
      <stop offset=".75" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hero-orbit-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <radialGradient id="hero-grid-fade" cx="68%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="hero-grid-mask">
      <rect width="1200" height="480" fill="url(#hero-grid-fade)"/>
    </mask>
    <filter id="hero-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="hero-arch"><path d="M847 380 V180 A118 118 0 0 1 1083 180 V380 Z"/></clipPath>
    <linearGradient id="hero-frame-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset=".5" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
  </defs>

  <style>
    .hero-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .hero-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .hero-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

    .hero-rise { animation: hero-rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .hero-fade { animation: hero-fade 1.6s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .9s; } .d5 { animation-delay: 1.2s; } .d6 { animation-delay: 1.5s; }

    .hero-draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.4s cubic-bezier(.65,0,.35,1) .9s forwards; }
    .hero-signal { stroke-dasharray: 500; stroke-dashoffset: 500; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 2.2s forwards; }

    .hero-portrait { animation: hero-photo 1.6s cubic-bezier(.16,1,.3,1) .5s both; }
    .hero-frame { stroke-dasharray: 900; stroke-dashoffset: 900; animation: hero-draw 2.2s cubic-bezier(.65,0,.35,1) 1s forwards; }

    @keyframes hero-photo { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes hero-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .hero-rise, .hero-fade, .hero-portrait { animation: none; }
      .hero-frame { animation: none; stroke-dashoffset: 0; }
      .hero-draw, .hero-signal { animation: none; stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- Canvas -->
    <rect width="1200" height="480" fill="url(#hero-bg)"/>

    <!-- Ambient glowing light fields -->
    <ellipse cx="900" cy="140" rx="420" ry="300" fill="url(#hero-light-a)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 30; 0 0" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>
    <ellipse cx="180" cy="460" rx="360" ry="220" fill="url(#hero-light-b)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 -25; 0 0" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
    </ellipse>

    <!-- Technical grid -->
    <rect width="1200" height="480" fill="url(#hero-grid)" mask="url(#hero-grid-mask)"/>

    <!-- Scanning line across the grid -->
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hero-scan)">
      <animate attributeName="y" values="-140;480" dur="11s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Drifting digital particles -->
    <g fill="#38BDF8">
      <circle cx="560" cy="120" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="120;96" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.1"><animate attributeName="opacity" values="0;.8;0" dur="5.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;48" dur="5.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="380" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="380;352" dur="4.8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="420" r="1.2"><animate attributeName="opacity" values="0;.7;0" dur="6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="420;396" dur="6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="60" r="1.3"><animate attributeName="opacity" values="0;.85;0" dur="5s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="60;40" dur="5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="250" r="1"><animate attributeName="opacity" values="0;.7;0" dur="4.4s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="250;226" dur="4.4s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Orbital ring system -->
    <g transform="translate(965 240)" class="hero-fade d3">
      <circle r="212" fill="none" stroke="#38BDF8" stroke-opacity=".12" stroke-dasharray="2 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="140s" repeatCount="indefinite"/>
      </circle>
      <circle r="190" fill="none" stroke="url(#hero-orbit-grad)" stroke-width="1.2"/>
      <circle r="160" fill="none" stroke="#60A5FA" stroke-opacity=".18" stroke-dasharray="3 7"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="95s" repeatCount="indefinite"/>
        <circle cx="0" cy="160" r="3" fill="#38BDF8" filter="url(#hero-glow)"/>
        <circle cx="-160" cy="0" r="2.2" fill="#60A5FA" fill-opacity=".8"/>
      </g>
    </g>

    <!-- Futuristic AI Core Portal Graphic on the Right -->
    <g class="hero-portrait">
      <path d="M835 392 V180 A130 130 0 0 1 1095 180 V392 Z" fill="none" stroke="#38BDF8" stroke-opacity=".25">
        <animate attributeName="stroke-opacity" values=".15;.6;.15" dur="5s" repeatCount="indefinite"/>
      </path>
      <g clip-path="url(#hero-arch)">
        <rect x="847" y="62" width="236" height="328" fill="#0B132B"/>
        <rect x="847" y="62" width="236" height="328" fill="url(#hero-light-a)" opacity=".4"/>
        
        <!-- Neural Constellation inside the arch -->
        <g transform="translate(965 240)">
          <!-- Core Neural Node -->
          <circle cx="0" cy="0" r="42" fill="#0369A1" fill-opacity=".3" stroke="#38BDF8" stroke-width="1.5">
            <animate attributeName="r" values="38;44;38" dur="4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="0" cy="0" r="24" fill="#0284C7" fill-opacity=".5" stroke="#BAE6FD" stroke-width="1">
            <animate attributeName="r" values="24;20;24" dur="4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="0" cy="0" r="8" fill="#FFFFFF" filter="url(#hero-glow)"/>
          
          <!-- Synaptic connection rays -->
          <line x1="0" y1="0" x2="-65" y2="-55" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="65" y2="-50" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="-75" y2="40" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="70" y2="45" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="0" y2="-85" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>
          <line x1="0" y1="0" x2="0" y2="85" stroke="#38BDF8" stroke-opacity=".5" stroke-width="1.2"/>

          <!-- Satellite Nodes -->
          <circle cx="-65" cy="-55" r="5" fill="#38BDF8"/>
          <circle cx="65" cy="-50" r="6" fill="#60A5FA"/>
          <circle cx="-75" cy="40" r="5" fill="#38BDF8"/>
          <circle cx="70" cy="45" r="5.5" fill="#93C5FD"/>
          <circle cx="0" cy="-85" r="6.5" fill="#38BDF8"/>
          <circle cx="0" cy="85" r="5" fill="#60A5FA"/>

          <!-- Data Labels inside Arch -->
          <text class="hero-mono" x="0" y="112" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#BAE6FD">MULTIMODAL AI</text>
        </g>

        <!-- Scanning pulse line inside the arch -->
        <line x1="847" y1="62" x2="1083" y2="62" stroke="#38BDF8" stroke-width="2" filter="url(#hero-glow)">
          <animate attributeName="y1" values="62;380;62" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="62;380;62" dur="6s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Arch Outline with Gradient -->
      <path class="hero-frame" d="M847 380 V180 A118 118 0 0 1 1083 180 V380 Z" fill="none" stroke="url(#hero-frame-grad)" stroke-width="1.5"/>

      <!-- Floating Tech Status Badge -->
      <g transform="translate(865 345)" class="hero-rise d4">
        <rect width="200" height="34" rx="8" fill="#0B1120" fill-opacity=".92" stroke="#38BDF8" stroke-opacity=".45"/>
        <circle cx="16" cy="17" r="4" fill="#34D399">
          <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text class="hero-mono" x="28" y="21" font-size="10.5" letter-spacing="1.2" fill="#E2E8F0">AI ENGINEER IN PROGRESS</text>
      </g>
    </g>

    <!-- Left Content Column -->
    <!-- Terminal Command Pill -->
    <g class="hero-rise d1" transform="translate(68 56)">
      <rect width="360" height="32" rx="16" fill="#0B1120" stroke="#38BDF8" stroke-opacity=".35"/>
      <circle cx="16" cy="16" r="4" fill="#38BDF8">
        <animate attributeName="r" values="4;5.5;4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text class="hero-mono" x="32" y="20.5" font-size="12" fill="#94A3B8">~/manotejareddy<tspan fill="#38BDF8"> $ </tspan><tspan fill="#F8FAFC">build --intelligent</tspan></text>
    </g>

    <!-- Main Heading / Name -->
    <g class="hero-rise d2">
      <text class="hero-serif" x="68" y="160" font-size="76" font-weight="300" letter-spacing="-2" fill="#F8FAFC">Mano Teja Reddy</text>
      <text class="hero-serif" x="68" y="160" font-size="76" font-weight="300" letter-spacing="-2" fill="url(#hero-sheen)">Mano Teja Reddy</text>
    </g>

    <!-- Professional Headline & Role -->
    <g class="hero-rise d3">
      <text class="hero-mono" x="70" y="202" font-size="14.5" letter-spacing="2.8" fill="#38BDF8">AI &amp; DATA SCIENCE · ASPIRING AI ENGINEER · WEB DEVELOPER</text>
    </g>

    <!-- Mission Statement -->
    <g class="hero-rise d4">
      <text class="hero-serif" x="70" y="244" font-size="20" font-style="italic" fill="#E2E8F0">Building intelligent applications, AI-powered products, and modern web experiences.</text>
    </g>

    <!-- Technical Divider Line -->
    <path class="hero-draw" d="M68 274 H780" stroke="url(#hero-rule)" stroke-width="1.2"/>

    <!-- Key Credentials & Meta Strip -->
    <g class="hero-rise d5" transform="translate(70 310)">
      <!-- Education -->
      <g>
        <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
        <text class="hero-mono" x="12" y="4" font-size="11.5" letter-spacing="1.5" fill="#38BDF8">EDUCATION</text>
        <text class="hero-sans" x="12" y="25" font-size="14" font-weight="500" fill="#F8FAFC">B.Tech AI &amp; Data Science · SIETK (JNTUA)</text>
        <text class="hero-sans" x="12" y="44" font-size="12.5" fill="#94A3B8">Graduation 2027 · CGPA 8.35/10</text>
      </g>

      <!-- Leadership -->
      <g transform="translate(340 0)">
        <circle cx="0" cy="0" r="3" fill="#60A5FA"/>
        <text class="hero-mono" x="12" y="4" font-size="11.5" letter-spacing="1.5" fill="#60A5FA">LEADERSHIP &amp; IMPACT</text>
        <text class="hero-sans" x="12" y="25" font-size="14" font-weight="500" fill="#F8FAFC">Technical Lead · Siddharth Hackfest 2026</text>
        <text class="hero-sans" x="12" y="44" font-size="12.5" fill="#94A3B8">ISTE First Prize (Road Pothole Detection) · 30+ Websites</text>
      </g>
    </g>

    <!-- Tags Row -->
    <g class="hero-rise d6" transform="translate(70 405)">
      <g><rect width="136" height="28" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-opacity=".3"/><text class="hero-mono" x="68" y="18" text-anchor="middle" font-size="11" fill="#BAE6FD">MedGemma / RAG</text></g>
      <g transform="translate(146 0)"><rect width="128" height="28" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-opacity=".3"/><text class="hero-mono" x="64" y="18" text-anchor="middle" font-size="11" fill="#BAE6FD">Vector Search</text></g>
      <g transform="translate(284 0)"><rect width="108" height="28" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-opacity=".3"/><text class="hero-mono" x="54" y="18" text-anchor="middle" font-size="11" fill="#BAE6FD">FastAPI / APIs</text></g>
      <g transform="translate(402 0)"><rect width="90" height="28" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-opacity=".3"/><text class="hero-mono" x="45" y="18" text-anchor="middle" font-size="11" fill="#BAE6FD">React UI</text></g>
      <g transform="translate(502 0)"><rect width="144" height="28" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-opacity=".3"/><text class="hero-mono" x="72" y="18" text-anchor="middle" font-size="11" fill="#BAE6FD">Infosys Springboard</text></g>
    </g>

  </g>
</svg>
