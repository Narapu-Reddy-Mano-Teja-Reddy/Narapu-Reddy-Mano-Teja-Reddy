<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p3-t">
  <title id="p3-t">Web Development &amp; Client Platforms: 30+ Websites Built</title>
  <defs>
    <linearGradient id="p3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <radialGradient id="p3-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#0369A1" stop-opacity=".65"/><stop offset="1" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p3-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#38BDF8" stroke-opacity=".08"/>
    </pattern>
    <filter id="p3-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p3-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p3-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#93C5FD"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .p3-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p3-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p3-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p3-in { animation: p3-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p3-d1 { animation-delay: .15s; } .p3-d2 { animation-delay: .4s; }
    .p3-chip { animation: p3-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p3-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p3-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p3-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p3-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p3-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-in, .p3-chip { animation: none; } .p3-draw { animation: none; stroke-dashoffset: 0; } }
    .p3-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p3-trace 7s linear infinite; }
    @keyframes p3-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p3-trace { display: none; } }
  </style>
  <g clip-path="url(#p3-clip)">
    <rect width="1200" height="370" fill="url(#p3-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p3-grid)"/>
    <rect width="1200" height="370" fill="url(#p3-glow)"/>
    <g class="p3-in p3-d1">
      <text class="p3-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#38BDF8">03 · FULL-STACK WEB DEVELOPMENT · FREELANCE &amp; CLIENT WORK</text>
      <text class="p3-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8FAFC">Client &amp; Web Platforms</text>
      <text class="p3-sans" x="56" y="166" font-size="17" fill="#94A3B8">Engineered 30+ responsive websites, web applications, and digital business solutions.</text>
      <text class="p3-mono" x="56" y="200" font-size="12.5" fill="#BAE6FD"><tspan fill="#38BDF8">EXPERIENCE ›</tspan> TENSPICK freelance, City Offers, D’Qualita Furnitures, Santric Technologies</text>
      <line class="p3-draw" x1="56" y1="226" x2="680" y2="226" stroke="#38BDF8" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p3-serif" font-size="32" font-weight="300" fill="#F8FAFC">30+</text><text class="p3-sans" y="24" font-size="12.5" fill="#94A3B8">websites developed &amp; shipped</text></g>
      <g transform="translate(266 266)"><text class="p3-serif" font-size="32" font-weight="300" fill="#F8FAFC">Full-Stack</text><text class="p3-sans" y="24" font-size="12.5" fill="#94A3B8">React UI + REST API backend</text></g>
      <g transform="translate(486 266)"><text class="p3-serif" font-size="32" font-weight="300" fill="#F8FAFC">Integrations</text><text class="p3-sans" y="24" font-size="12.5" fill="#94A3B8">payment gateways &amp; third-party APIs</text></g>
      <g class="p3-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="58" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="85" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">React</text></g>
      <g class="p3-chip" style="animation-delay:1.12s"><rect x="122" y="314" width="92" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="168" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">JavaScript</text></g>
      <g class="p3-chip" style="animation-delay:1.24s"><rect x="222" y="314" width="108" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="276" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">HTML5 / CSS3</text></g>
      <g class="p3-chip" style="animation-delay:1.36s"><rect x="338" y="314" width="82" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="379" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">FastAPI</text></g>
      <g class="p3-chip" style="animation-delay:1.48s"><rect x="428" y="314" width="88" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="472" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">REST APIs</text></g>
      <g class="p3-chip" style="animation-delay:1.60s"><rect x="524" y="314" width="70" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="559" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Vercel</text></g>
      <g class="p3-chip" style="animation-delay:1.72s"><rect x="602" y="314" width="70" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".35"/><text class="p3-mono" x="637" y="331" text-anchor="middle" font-size="11.5" fill="#BAE6FD">Netlify</text></g>
    </g>
    <g class="p3-in p3-d2"><g transform="translate(0 35)">
      <g transform="translate(860 40)">
        <!-- Browser frame mockup -->
        <rect x="0" y="8" width="260" height="180" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".4"/>
        <rect x="0" y="8" width="260" height="26" rx="10" fill="#1E293B"/>
        <circle cx="16" cy="21" r="3.5" fill="#EF4444"/>
        <circle cx="28" cy="21" r="3.5" fill="#F59E0B"/>
        <circle cx="40" cy="21" r="3.5" fill="#10B981"/>
        <rect x="56" y="15" width="140" height="12" rx="4" fill="#0F172A"/>
        <text class="p3-mono" x="64" y="24" font-size="8" fill="#94A3B8">https://manotejareddy.xyz</text>
        <!-- Mockup layout elements -->
        <rect x="16" y="46" width="100" height="14" rx="3" fill="#38BDF8" fill-opacity=".3"/>
        <rect x="16" y="66" width="140" height="6" rx="2" fill="#94A3B8" fill-opacity=".4"/>
        <rect x="16" y="78" width="120" height="6" rx="2" fill="#94A3B8" fill-opacity=".4"/>
        <g transform="translate(16 96)">
          <rect width="68" height="42" rx="4" fill="#1E293B"/>
          <rect x="80" width="68" height="42" rx="4" fill="#1E293B"/>
          <rect x="160" width="68" height="42" rx="4" fill="#1E293B"/>
        </g>
        <g transform="translate(20 196)">
          <rect width="220" height="38" rx="8" fill="#0B1120" fill-opacity=".95" stroke="#38BDF8" stroke-opacity=".45"/>
          <text class="p3-mono" x="14" y="24" font-size="11" fill="#38BDF8">CLIENTS &amp; PRODUCTION</text>
        </g>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#38BDF8" stroke-opacity=".2"/>
    <rect class="p3-trace" style="animation-delay:0.0s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p3-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
