    <radialGradient id="ce-glow" cx="15%" cy="100%" r="70%"><stop offset="0" stop-color="#1D4ED8" stop-opacity=".5"/><stop offset="1" stop-color="#0B1120" stop-opacity="0"/></radialGradient>
    <linearGradient id="ce-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#93C5FD"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
